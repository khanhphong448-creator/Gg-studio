name: Build Gemini Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 4. Cài đặt thư viện
        run: flutter pub get

      - name: 5. Biên dịch file APK
        run: flutter build apk --release

      - name: 6. Xuất bản file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Native-App
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
